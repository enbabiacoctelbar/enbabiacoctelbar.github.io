es:{hi:'¡Hola! Soy el asistente de Enbabia. Pregúntame por entradas, carta, reservas, música o ubicación.',pr:'{n}: {p} €. ¿Quieres pedirlo por WhatsApp?',thanks:'¡A ti! Si quieres, también te atendemos por WhatsApp.',entry:'La entrada incluye 1 consumición + 2 chupitos gratis. Precio: {P}. Solo confirmamos reservas hechas antes de las 20:00; no válida en Halloween, Nochevieja ni partidos de Champions.',vip:'Tenemos mesas de botella especiales: mesa reservada, botella y servicio de coctelero. Pídela en el formulario de Reservas (tipo "Mesa de botella") o por WhatsApp. Los precios están en la carta, pestaña Botellas.',book:'Puedes reservar en el formulario de Reservas (sin pagar nada por adelantado) o por WhatsApp. Dinos la fecha y cuántas personas sois.',event:'Organizamos cumpleaños, cenas de empresa y eventos privados, sin pago adelantado. Usa el formulario de Reservas o escríbenos por WhatsApp.',music:'Suena reguetón, bachata, merengue y música comercial para bailar toda la noche.',hours:'El horario exacto te lo confirma el equipo. Escríbenos por WhatsApp y te respondemos.',where:'Aquí tienes cómo llegar: '+MP,menu:'Los cócteles cuestan {C} €. También tenemos sin alcohol, chupitos, copas, cerveza, vino y botellas. Mira la carta completa en la web y pide por WhatsApp con el precio. Puedes preguntarme el precio de cualquier producto.',about:'Somos un cóctel bar de coctelería artesanal, con cocteleros muy profesionales, buena música y un ambiente único. Recibimos turistas de todo el mundo y universitarios.',fb:'Esa pregunta mejor te la responde el equipo. Pulsa el botón de WhatsApp y les envío tu consulta.'},
en:{hi:'Hi! I’m the Enbabia assistant. Ask me about tickets, the menu, bookings, music or location.',pr:'{n}: €{p}. Would you like to order it on WhatsApp?',thanks:'You’re welcome! You can also chat with us on WhatsApp.',entry:'Your ticket includes 1 drink + 2 free shots. Price: {P}. We only confirm bookings made before 20:00; not valid on Halloween, New Year’s Eve or Champions League nights.',vip:'We offer special bottle tables: reserved table, bottle and bartender service. Request one in the Bookings form (type "Bottle table") or on WhatsApp. Prices are in the menu, Bottles tab.',book:'You can book in the Bookings form (nothing to pay in advance) or on WhatsApp. Tell us the date and number of guests.',event:'We host birthdays, company dinners and private events, with no advance payment. Use the Bookings form or message us on WhatsApp.',music:'We play reggaeton, bachata, merengue and commercial music, to dance all night.',hours:'The team will confirm the exact hours. Message us on WhatsApp and we’ll reply.',where:'Here’s how to get there: '+MP,menu:'Cocktails are €{C}. We also have alcohol-free drinks, shots, mixed drinks, beer, wine and bottles. See the full menu on the page and order on WhatsApp with the price. You can ask me the price of any item.',about:'We are a craft cocktail bar with highly professional bartenders, great music and a unique atmosphere. We welcome tourists from all over the world and university students.',fb:'The team can answer that better. Tap the WhatsApp button and I’ll send them your question.'},
fr:{hi:'Bonjour ! Je suis l’assistant d’Enbabia. Posez-moi vos questions sur les entrées, la carte, les réservations, la musique ou l’adresse.',pr:'{n} : {p} €. Voulez-vous le commander sur WhatsApp ?',thanks:'Avec plaisir ! Vous pouvez aussi nous écrire sur WhatsApp.',entry:'L’entrée comprend 1 consommation + 2 shots offerts. Prix : {P}. Nous ne confirmons que les réservations faites avant 20 h 00 ; non valable pour Halloween, le Nouvel An ni les soirs de Ligue des champions.',vip:'Nous proposons des tables bouteille spéciales : table réservée, bouteille et service barman. Demandez-la dans le formulaire (type « Table bouteille ») ou sur WhatsApp. Les prix sont dans la carte, onglet Bouteilles.',book:'Vous pouvez réserver avec le formulaire (sans paiement à l’avance) ou sur WhatsApp. Indiquez la date et le nombre de personnes.',event:'Nous organisons anniversaires, dîners d’entreprise et événements privés, sans paiement à l’avance. Utilisez le formulaire ou écrivez-nous sur WhatsApp.',music:'Reggaeton, bachata, merengue et musique commerciale pour danser toute la nuit.',hours:'L’équipe vous confirmera les horaires exacts. Écrivez-nous sur WhatsApp.',where:'Voici l’itinéraire : '+MP,menu:'Les cocktails coûtent {C} €. Nous avons aussi des boissons sans alcool, des shots, de la bière, du vin et des bouteilles. Voyez la carte complète sur la page et commandez sur WhatsApp. Demandez-moi le prix de n’importe quel produit.',about:'Un cocktail bar de cocktails artisanaux, avec des barmen très professionnels, bonne musique et ambiance unique. Nous accueillons des touristes du monde entier et des étudiants.',fb:'L’équipe répondra mieux à cette question. Appuyez sur le bouton WhatsApp et je lui envoie votre demande.'},
it:{hi:'Ciao! Sono l’assistente di Enbabia. Chiedimi di ingressi, menu, prenotazioni, musica o dove siamo.',pr:'{n}: {p} €. Vuoi ordinarlo su WhatsApp?',thanks:'Di nulla! Puoi anche scriverci su WhatsApp.',entry:'L’ingresso include 1 consumazione + 2 shot gratis. Prezzo: {P}. Confermiamo solo le prenotazioni prima delle 20:00; non valido per Halloween, Capodanno né serate di Champions.',vip:'Abbiamo tavoli bottiglia speciali: tavolo riservato, bottiglia e servizio barman. Richiedilo nel modulo (tipo “Tavolo bottiglia”) o su WhatsApp. I prezzi sono nel menu, scheda Bottiglie.',book:'Puoi prenotare con il modulo (senza pagamento anticipato) o su WhatsApp. Indica data e numero di persone.',event:'Organizziamo compleanni, cene aziendali ed eventi privati, senza pagamento anticipato. Usa il modulo o scrivici su WhatsApp.',music:'Reggaeton, bachata, merengue e musica commerciale per ballare tutta la notte.',hours:'Il team ti confermerà gli orari esatti. Scrivici su WhatsApp.',where:'Ecco come arrivare: '+MP,menu:'I cocktail costano {C} €. Abbiamo anche analcolici, shot, long drink, birra, vino e bottiglie. Guarda il menu completo nella pagina e ordina su WhatsApp. Chiedimi il prezzo di qualsiasi prodotto.',about:'Siamo un cocktail bar artigianale con barman molto professionali, buona musica e atmosfera unica. Accogliamo turisti da tutto il mondo e universitari.',fb:'Il team saprà rispondere meglio. Premi il pulsante WhatsApp e invio la tua domanda.'},
ar:{hi:'مرحبا! أنا مساعد Enbabia. اسألني عن التذاكر والقائمة والحجوزات والموسيقى والموقع.',pr:'{n}: {p} €. هل تريد طلبه عبر واتساب؟',thanks:'عفوا! يمكنك أيضا مراسلتنا عبر واتساب.',entry:'التذكرة تشمل مشروبا واحدا + شوتان مجانا. السعر: {P}. نؤكد فقط الحجوزات قبل الساعة 20:00، وغير صالحة في الهالوين ورأس السنة ومباريات دوري الأبطال.',vip:'لدينا طاولات زجاجات خاصة: طاولة محجوزة وزجاجة وخدمة باريستا. اطلبها من نموذج الحجوزات أو عبر واتساب. الأسعار في القائمة، قسم الزجاجات.',book:'يمكنك الحجز عبر نموذج الحجوزات (بدون دفع مسبق) أو عبر واتساب. أخبرنا بالتاريخ وعدد الأشخاص.',event:'ننظم أعياد الميلاد وعشاء الشركات والفعاليات الخاصة بدون دفع مسبق. استخدم نموذج الحجز أو راسلنا عبر واتساب.',music:'ريغيتون وباتشاتا وميرنغي وموسيقى تجارية لترقص طوال الليل.',hours:'سيؤكد لك الفريق المواعيد بدقة. راسلنا عبر واتساب.',where:'إليك الطريق: '+MP,menu:'الكوكتيلات بسعر {C} €. لدينا أيضا مشروبات بدون كحول وشوتس وبيرة ونبيذ وزجاجات. شاهد القائمة الكاملة في الصفحة واطلب عبر واتساب. اسألني عن سعر أي منتج.',about:'بار كوكتيلات حرفية مع محترفين وموسيقى رائعة وأجواء فريدة. نستقبل سياحا من كل العالم وطلاب الجامعات.',fb:'الفريق يجيب على هذا أفضل. اضغط زر واتساب وأرسل لهم سؤالك.'}};
